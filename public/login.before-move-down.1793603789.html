<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MangaVault - Login</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background: #0a0512 url('/assets/bg.png?v=2') center/cover no-repeat;
      position: relative;
      overflow: hidden;
    }
    /* The purple dark overlay so the text is readable */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(10, 5, 18, 0.2) 0%, rgba(50, 10, 90, 0.3) 100%);
      z-index: 1;
    }
    .login-box { 
      position: relative; 
      z-index: 2; 
      background: rgba(20, 10, 35, 0.7); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px 30px; 
      border-radius: 20px; 
      border: 1px solid rgba(138,43,226,0.4); 
      width: 100%; 
      max-width: 340px; 
      text-align: center; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(138,43,226,0.15);
    }
    h1 { color: #fff; margin-top: 0; font-size: 28px; margin-bottom: 4px; letter-spacing: 1px; text-shadow: 0 0 20px rgba(138,43,226,0.5); }
    .subtitle { color: #b88aff; font-size: 11px; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; font-weight: 600; }
    input { 
      width: 100%; 
      padding: 14px 16px; 
      margin: 8px 0; 
      background: rgba(0,0,0,0.4); 
      border: 1px solid rgba(138,43,226,0.3); 
      border-radius: 10px; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      transition: all 0.2s;
    }
    input:focus { border-color: #8a2be2; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
    button { 
      width: 100%; 
      padding: 14px; 
      margin-top: 20px; 
      background: linear-gradient(135deg, #8a2be2, #6a1b9a); 
      border: none; 
      border-radius: 10px; 
      color: #fff; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 15px; 
      transition: transform 0.1s, box-shadow 0.2s; 
      box-shadow: 0 4px 15px rgba(138,43,226,0.3);
    }
    button:active { transform: scale(0.98); }
    button:hover { box-shadow: 0 6px 20px rgba(138,43,226,0.5); }
    #error { color: #f87171; font-size: 13px; margin-top: 16px; display: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>MangaVault</h1>
    <div class="subtitle">Story Research Studio</div>
    <input type="text" id="user" placeholder="Username" value="admin" autocomplete="username">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <button onclick="login()">Enter the Vault</button>
    <div id="error">Invalid username or password</div>
  </div>
  <script>
    async function login() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          window.location.href = "/";
        } else {
          document.getElementById("error").style.display = "block";
        }
      } catch(e) {
        document.getElementById("error").textContent = "Network error";
        document.getElementById("error").style.display = "block";
      }
    }
    document.getElementById("pass").addEventListener("keypress", function(e) {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
